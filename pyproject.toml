[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twoparty"
version = "0.1.0"
description = "Two-party ECDSA: implementation and cost measurements (HSG Bachelor project)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["coincurve>=20"]

[project.optional-dependencies]
dev = ["pytest"]
mta = ["phe"]   # only to cross-check our Paillier against the phe library (tests)
fast = ["gmpy2"]   # building block "big-number arithmetic", variant gmpy2

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
